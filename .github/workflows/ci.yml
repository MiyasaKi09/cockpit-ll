name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint server scripts
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Assistant API tests
        run: npm run test:assistant

      - name: Relay security tests
        run: npm run test:relais

      - name: Edge Functions security tests
        run: npm run test:edge-security

      - name: Production rollout consistency
        run: npm run test:mise-en-production

      - name: Person rename integrity
        run: npm run test:renommage

      - name: Gmail backlink on attachments
        run: npm run test:lien-gmail

      - name: Sync privacy tests
        run: npm run test:sync-state

      - name: Invoice invariant tests
        run: npm run test:facture-invariants

      - name: Current-user identity
        run: npm run test:identite

      - name: Project and document anchoring fields
        run: npm run test:champs

      - name: Member registry and hardcoded addresses
        run: npm run test:registre

      - name: Exchange categorisation referential
        run: npm run test:categorisation

      - name: Planned-hours baseline
        run: npm run test:baseline

      - name: Project folder tree
        run: npm run test:arborescence

      - name: Project team on creation
        run: npm run test:equipe

      - name: Home screen blocks and no recomputation
        run: npm run test:accueil

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Finance browser recipe
        run: npm run test:finance
