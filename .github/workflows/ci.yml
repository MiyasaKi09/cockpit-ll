name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint server scripts
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Assistant API tests
        run: npm run test:assistant

      - name: Relay security tests
        run: npm run test:relais

      - name: Edge Functions security tests
        run: npm run test:edge-security

      - name: Production rollout consistency
        run: npm run test:mise-en-production

      - name: Person rename integrity
        run: npm run test:renommage

      - name: Gmail backlink on attachments
        run: npm run test:lien-gmail

      - name: Sync privacy tests
        run: npm run test:sync-state

      - name: Invoice invariant tests
        run: npm run test:facture-invariants

      - name: Current-user identity
        run: npm run test:identite

      - name: Project and document anchoring fields
        run: npm run test:champs

      - name: Member registry and hardcoded addresses
        run: npm run test:registre

      - name: Exchange categorisation referential
        run: npm run test:categorisation

      - name: Planned-hours baseline
        run: npm run test:baseline

      - name: Project folder tree
        run: npm run test:arborescence

      - name: Project team on creation
        run: npm run test:equipe

      - name: Home screen blocks and no recomputation
        run: npm run test:accueil

      - name: Google OAuth scopes stay read-only
        run: npm run test:oauth

      - name: Machine proposals remain editable
        run: npm run test:propositions

      - name: No hardcoded sign-in addresses
        run: npm run test:adresses

      - name: Enriched Gmail ingestion and incremental cursor
        run: npm run test:ingestion-gmail

      - name: Message index, closed axes and machine proposals
        run: npm run test:communications

      - name: Offline cache, idempotent write queue and message access layer
        run: npm run test:hors-ligne

      - name: Unified project attachment cascade and learned corrections
        run: npm run test:rattachement

      - name: Draft summaries stay attached, bounded and labelled
        run: npm run test:resume

      - name: Deterministic three-axis classifier and its French reasons
        run: npm run test:classement

      - name: Pure message selectors
        run: npm run test:selecteurs

      - name: On-screen notifications stay bounded
        run: npm run test:notifications

      - name: Inbox switchover keeps both memories
        run: npm run test:boite

      - name: Append-only audit journal
        run: npm run test:audit

      - name: Two-stage detectors and their false positives
        run: npm run test:detecteurs

      - name: Internal tasks collection and its migration step
        run: npm run test:taches

      - name: Machine proposals stay reviewable (criterion 11)
        run: npm run test:critere11

      - name: Time totals are conserved through both projections
        run: npm run test:conservation

      - name: Proposal review creates and signs, never transforms
        run: npm run test:revue-propositions

      - name: Member departure transfers instead of orphaning
        run: npm run test:depart

      - name: Task templates preview before creating
        run: npm run test:modeles

      - name: Chrono switchover, minimum duration and single timer per person
        run: npm run test:chrono

      - name: Offline app shell precache and update policy
        run: npm run test:coquille

      - name: Week total is computed once for both time views
        run: npm run test:temps-mobile

      - name: No raw JSX tables outside the recensed files
        run: npm run test:tableaux

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Finance browser recipe
        run: npm run test:finance
